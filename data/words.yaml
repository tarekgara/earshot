# Earshot vocabulary layer.
#
# For every sound id in library.yaml: the words people use for it.
#   synonyms: words that name this sound well (base word, verb forms, caption verbs, US/UK variants)
#   written:  how the sound is spelled in text, comics and subtitles
#   loose:    imprecise or broader words, or words that mainly mean a neighbouring sound
#   note:     how to choose when a common word is ambiguous

# ================================================================ voice

cough:
  synonyms: [cough, coughs, coughing, coughing fit, hacking cough, hack, dry cough, chesty cough, splutter, sputter]
  written: [cough, ahem]
  loose: [throat clear, wheeze, choke, bark, clear throat]
  note: >-
    People write "ahem" for both, but a cough starts with an explosive pop from the chest while a throat clear is a gentler, deliberate rasp.

throat-clear:
  synonyms: [throat clearing, clears throat, clearing throat, clear throat, ahem, harrumph, hem]
  written: [ahem, hem, harrumph, ehem]
  loose: [cough, grunt, hack, rasp]
  note: >-
    A captioned "[clears throat]" is usually this sound, not a cough: listen for a scrape with a bit of voice rather than a burst.

sneeze:
  synonyms: [sneeze, sneezes, sneezing, sneezing fit]
  written: [achoo, atchoo, atishoo, ah-choo]
  loose: [cough, snort, sniff]

sniff:
  synonyms: [sniff, sniffs, sniffing, sniffle, sniffles, sniffling, snuffle, snuffling, snivel]
  written: [sniff]
  loose: [snort, inhale, breath in, scoff]
  note: >-
    A sniff is a quick breath in through the nose; a snort is a forceful blast that rattles, usually outwards.

laugh:
  synonyms: [laugh, laughs, laughing, laughter, belly laugh, guffaw, guffaws, cackle, cackling, roar of laughter, howl of laughter, hearty laugh]
  written: [haha, hahaha, ha-ha, bwahaha, mwahaha]
  loose: [chuckle, giggle, snicker, titter, snort, chortle, hoot]
  note: >-
    "Laugh" covers every kind; for a light high one search giggle, for a low closed-mouth one chuckle.

giggle:
  synonyms: [giggle, giggles, giggling, titter, tittering, snicker, snickering, snigger, sniggering, tee-hee]
  written: [hehe, teehee, tee-hee, hihi]
  loose: [laugh, chuckle, chortle, squeal]
  note: >-
    Snicker (US) and snigger (UK) are the same half-suppressed giggle, often a little mocking.

chuckle:
  synonyms: [chuckle, chuckles, chuckling, chortle, chortles, chortling, soft laugh, low laugh, quiet laugh]
  written: [heh, heh heh]
  loose: [laugh, giggle, snicker, scoff, snort]
  note: >-
    A chuckle is a low, mostly closed-mouth laugh; a chortle is a gleeful chuckle and sits between chuckle and laugh.

scoff:
  synonyms: [scoff, scoffs, scoffing, pff, pfft, derisive laugh, snort of contempt, dismissive snort, sneer]
  written: [pff, pfft, pfff, psh, pssh, tch]
  loose: [snort, sigh, chuckle, huff, scornful laugh, raspberry, tut]
  note: >-
    People say "snort" for a scoff; a scoff is a light puff of disbelief, a snort a heavier blast that rattles the nose.

snort:
  synonyms: [snort, snorts, snorting, snorting laugh, snort laugh, nasal snort]
  written: [snrk, hmph, snort]
  loose: [scoff, sniff, grunt, huff, oink, snore]
  note: >-
    A snort is a forceful burst out through the nose with a rattle; if it is a quick breath in, it is a sniff, and if it is asleep, a snore.

sigh:
  synonyms: [sigh, sighs, sighing, heavy sigh, deep sigh, sigh of relief, exhale, exhales]
  written: [sigh, haah, phew, whew, hah]
  loose: [huff, groan, breath, breathe out, moan, yawn]
  note: >-
    A sigh is mostly breath falling away; once it has a rough voiced "ugh" in it, it is a groan.

gasp:
  synonyms: [gasp, gasps, gasping, sharp intake of breath, sharp breath, inhale, inhales, gulp of air]
  written: [gasp, hah]
  loose: [pant, sniff, wheeze, sob, hiccup, breath in]
  note: >-
    A gasp is one sudden breath in from surprise or effort; repeated fast breaths are panting.

groan:
  synonyms: [groan, groans, groaning, grumble, grumbling, groan of annoyance, groan of pain]
  written: [ugh, ughh, urgh, argh, uhh]
  loose: [moan, grunt, sigh, whine, mutter, complain]
  note: >-
    People often say "moan" for a groan; a groan is rougher, lower and more annoyed, a moan smoother and longer, about pain or pleasure.

moan:
  synonyms: [moan, moans, moaning, low moan, wail, wailing]
  written: [mmm, ohh, oooh]
  loose: [groan, whimper, whine, hum, sigh, sob]
  note: >-
    In British English "moan" also means to complain, which is closer to a groan; the sound itself is a smooth, wavering voiced note.

grunt:
  synonyms: [grunt, grunts, grunting, grunt of effort, oof, umph, oomph, strain, straining, exertion]
  written: [hnng, oof, umph, ungh, hmph]
  loose: [groan, snort, huff, growl, oink]
  note: >-
    A grunt is short and pushed out with effort; if it drags on and sounds unhappy it is a groan.

yawn:
  synonyms: [yawn, yawns, yawning, big yawn, sleepy yawn]
  written: [yawn, aaah]
  loose: [sigh, groan, stretch, breath]

hum:
  synonyms: [hum, hums, humming, hummed tune, humming a tune, hum along]
  written: [hmm, mmm, hmm-hmm, mm-hmm, la la la]
  loose: [moan, drone, buzz, murmur, sing, croon, whir]
  note: >-
    "Hum" also names machine and electrical drones; this entry is a person humming a tune with the mouth closed.

whistling:
  synonyms: [whistle, whistles, whistling, wolf whistle, human whistle, whistled tune, catcall, whistling a tune]
  written: [wheet-whew, fweet, tweet]
  loose: [kettle whistle, train whistle, birdsong, hoot, pipe]
  note: >-
    "Whistle" also means a kettle, train or referee whistle; this entry is a person whistling through the lips.

scream:
  synonyms: [scream, screams, screaming, shriek, shrieks, shrieking, screech, screeching, scream of terror, bloodcurdling scream, squeal]
  written: [aaah, aaaaah, eek, ahhh]
  loose: [shout, yell, cry, wail, howl, holler, yelp]
  note: >-
    A scream is high and piercing with no words; a shout is lower and usually carries a word or name.

shout:
  synonyms: [shout, shouts, shouting, yell, yells, yelling, holler, hollering, bellow, bellowing, call out, cry out]
  written: [hey, oi, hey you, yo]
  loose: [scream, cheer, cry, roar, call, bawl]
  note: >-
    A shout or yell is loud speech; if it is wordless, high and frightened, it is a scream.

crying:
  synonyms: [cry, cries, crying, sob, sobs, sobbing, weep, weeping, blubbering, bawling, wailing, tears]
  written: [sob, boohoo, waah, sniff]
  loose: [whimper, wail, moan, sniffle, whine, howl]
  note: >-
    "Cry" can also mean shout ("a cry for help"); this entry is adult crying, with shaky sobs and broken breaths.

baby-cry:
  synonyms: [baby crying, baby cry, crying baby, infant crying, infant cry, newborn crying, baby wailing, baby screaming, bawling baby, wah]
  written: [waah, wah wah, waaa, wahh]
  loose: [wail, crying, scream, whimper, fussing, mewl, howl]
  note: >-
    Toddlers and babies both "cry", but an infant's cry is a rhythmic "waa" with gasps between, much less shaky than adult sobbing.

baby-laugh:
  synonyms: [baby laughing, baby laugh, baby giggling, baby giggle, infant laughing, toddler laughing, baby squealing, baby chuckle]
  written: [hehe, eee, ahaha]
  loose: [giggle, squeal, laugh, coo, babble, gurgle]

burp:
  synonyms: [burp, burps, burping, belch, belches, belching, eructation]
  written: [burp, buurp, urp, brap]
  loose: [croak, grunt, hiccup, gas]
  note: >-
    Burp and belch name the same thing; "belch" is usually used for a louder, longer one.

hiccup:
  synonyms: [hiccup, hiccups, hiccuping, hiccupping, hiccough, hiccoughs, the hiccups]
  written: [hic, hick, hic hic]
  loose: [gasp, gulp, burp]

kiss:
  synonyms: [kiss, kisses, kissing, smooch, smooching, peck, air kiss, smack, lip smack]
  written: [mwah, muah, smack, smooch]
  loose: [click, pop, slurp]

shush:
  synonyms: [shush, shushes, shushing, shh, hush, hushing, shushing sound]
  written: [shh, shhh, sh, hush, psst]
  loose: [hiss, whisper, sss]
  note: >-
    "Psst" is a short call for attention rather than a request for quiet, but it is the same airy hiss of the tongue.

tongue-click:
  synonyms: [tongue click, tongue clicks, clicking tongue, tut, tutting, tsk, tsking, tut-tut, cluck, clucking tongue]
  written: [tsk, tsk tsk, tut, tut-tut, tch, tck]
  loose: [click, clop, kiss, smack, tick]
  note: >-
    "Tsk" and "tut" are the disapproving click; the hollow "clop" to call a horse is the same tongue action, lower.

breathing:
  synonyms: [breathing, breath, breaths, breathe, breathes, breathing in and out, inhale and exhale, respiration, slow breathing]
  written: [hhh, haah, huff]
  loose: [panting, wheezing, sighing, heavy breathing, snoring, wind]
  note: >-
    Plain steady breathing is calm; if the breaths are fast and open-mouthed, look at panting, and if asleep and rattling, snoring.

panting:
  synonyms: [panting, pant, pants, heavy breathing, out of breath, breathless, puffing, huffing and puffing, gasping for breath, catching breath]
  written: [huff huff, pant pant, hah hah]
  loose: [breathing, gasping, wheezing, dog panting]
  note: >-
    "Heavy breathing" can mean slow loud breaths too; panting is specifically fast, short breaths after effort.

snore:
  synonyms: [snore, snores, snoring, snorer, loud snoring, sawing logs]
  written: [zzz, zzzz, honk-shoo]
  loose: [snort, grunt, rumble, purr, wheeze, breathing]
  note: >-
    A snore is a rattling breath while asleep, usually on the in-breath; a snort is an awake blast out through the nose.

gargle:
  synonyms: [gargle, gargles, gargling, mouthwash gargle, rinsing mouth]
  written: [glglgl, gargle]
  loose: [gurgle, bubbling, rinse, swish]
  note: >-
    "Gurgle" also covers drains and streams; gargling is water bubbled deliberately in the throat.

# ================================================================ body

footsteps:
  synonyms: [footsteps, footstep, steps, walking, walks, footfalls, treads, pacing, stomping, tramping, plodding, heels clicking, approaching footsteps]
  written: [clomp, clack, tap tap, stomp]
  loose: [running, shuffling, creeping, tiptoeing, stamping, clip-clop]
  note: >-
    Hooves on a hard road also make a steady clop; human footsteps are two-beat (left, right) and lighter.

clapping:
  synonyms: [clap, claps, clapping, hand clap, handclap, single clap, slow clap, clapping hands]
  written: [clap, clap clap]
  loose: [applause, slap, smack, snap]
  note: >-
    One person's claps are clapping; many people at once is applause.

applause:
  synonyms: [applause, applauding, applauds, ovation, standing ovation, round of applause, audience clapping, crowd clapping]
  written: [clap clap clap]
  loose: [clapping, cheering, crowd, rain, crackling]
  note: >-
    Applause is a dense wash of many claps and can sound like heavy rain; listen for small hand slaps inside it.

finger-snap:
  synonyms: [finger snap, finger snaps, snap, snaps, snapping, snapping fingers, finger click, clicking fingers]
  written: [snap, click]
  loose: [click, clap, crack, tick]
  note: >-
    In British English people often say "clicking your fingers"; it means the same as snapping them.

knock:
  synonyms: [knock, knocks, knocking, knock on door, knock at the door, rap, raps, rapping, tapping, door knock, knuckles on wood]
  written: [knock knock, rat-a-tat, tap tap, rap rap]
  loose: [bang, banging, pounding, thump, hammering, tap]
  note: >-
    Loud pounding with the fist or side of the hand is still knocking; a hammer has a sharper, ringing blow.

typing:
  synonyms: [typing, types, keyboard, typing on keyboard, keystrokes, keyboard clicks, keyboard clacking, clacking keys, typewriter]
  written: [clack clack, tap tap tap, click clack, clackety-clack]
  loose: [clicking, tapping, clatter, mouse click]
  note: >-
    A typewriter is louder and ends lines with a bell and carriage return; a computer keyboard is lighter and more even.

writing:
  synonyms: [writing, writes, scribbling, scribble, scribbles, pen on paper, pencil on paper, pencil scratching, pen scratching, handwriting, scratching pen, signing]
  written: [scritch, scratch scratch, scritch-scratch]
  loose: [scratching, drawing, rustling, sketching, chalk on blackboard]

chewing:
  synonyms: [chewing, chews, chew, munching, munch, munches, crunching, crunch, eating, eats, chomping, chomp, gnawing, mastication]
  written: [munch, crunch, chomp, nom nom, om nom]
  loose: [slurping, biting, smacking lips, crackling, swallowing]

drinking:
  synonyms: [drinking, drink, gulping, gulp, gulps, swallowing, swallow, slurping, slurp, sipping, sip, guzzling, chugging, glug]
  written: [gulp, glug, glug glug, slurp, sip]
  loose: [pouring, gargling, hiccup, swig]

heartbeat:
  synonyms: [heartbeat, heartbeats, heart beating, heart pounding, heart thumping, pulse, pulsing, heart, beating heart, racing heart, palpitations]
  written: [lub-dub, ba-dum, thump-thump, ba-dump]
  loose: [thump, throb, thud, drum, pounding]

crowd:
  synonyms: [crowd, crowd chatter, chatter, chattering, murmur, murmuring, hubbub, babble, babbling voices, walla, background voices, people talking, din, restaurant noise, party noise]
  written: [murmur, chatter]
  loose: [noise, voices, buzz, conversation, cheering, ambience, talking]
  note: >-
    Crowd chatter is many voices at conversation level; if they are shouting in excitement, it is cheering.

cheering:
  synonyms: [cheering, cheer, cheers, crowd cheer, crowd cheering, roar of the crowd, whooping, whoop, hooray, hurrah, celebration, crowd roar]
  written: [hooray, hurray, yay, woohoo, whoo, yeah]
  loose: [applause, shouting, crowd, screaming, chanting, roar]
  note: >-
    Cheering is voices shouting with joy; clapping alone is applause, and a long low "boo" is booing.

booing:
  synonyms: [booing, boo, boos, booed, crowd booing, jeering, jeers, catcalls, heckling, hissing crowd]
  written: [boo, booo, boooo]
  loose: [jeer, heckle, hiss, crowd, groan]
  note: >-
    Jeering and heckling include shouted words; booing is the long, low, wordless "boo".

# ================================================================ animals

bark:
  synonyms: [bark, barks, barking, dog bark, dog barking, woof, woofs, yap, yaps, yapping, bay, baying, ruff]
  written: [woof, woof woof, arf, ruff, bow-wow, yip]
  loose: [growl, yelp, howl, bowwow, cough]
  note: >-
    A yap or yip is a small dog's high bark; baying is a hound's long, musical bark close to a howl.

growl:
  synonyms: [growl, growls, growling, snarl, snarls, snarling, dog growl, dog growling, rumble]
  written: [grr, grrr, grrrr]
  loose: [roar, purr, bark]
  note: >-
    "Growl" is used for dogs, big cats and stomachs; this entry is a dog's low warning rumble.

whine:
  synonyms: [whine, whines, whining, whimper, whimpers, whimpering, dog whine, dog whining, dog whimpering, yelp, yelping, keening]
  written: [whimper, hnnng]
  loose: [whinge, cry, mewl, howl, squeak, squeal, mew]
  note: >-
    "Whine" also names engines and mosquitoes; for a dog, a whimper is softer and broken, a whine longer and more pleading, and a yelp is a sharp single cry of pain.

dog-pant:
  synonyms: [dog panting, dog pant, panting dog, dog breathing, dog huffing, dog puffing]
  written: [hah hah hah, hhh hhh]
  loose: [panting, breathing, wheezing]

cat-meow:
  synonyms: [meow, meows, meowing, miaow, miaowing, mew, mews, mewing, cat meow, cat meowing, cat crying, caterwaul, caterwauling, yowl, yowling]
  written: [meow, miaow, mew, mrow, mrrp]
  loose: [mewl, whine, cry, purr, chirp, trill]
  note: >-
    Mew is a small, soft meow (often kittens); yowl and caterwaul are long, loud cat cries, often at night or in a fight.

cat-purr:
  synonyms: [purr, purrs, purring, cat purr, cat purring, contented cat]
  written: [purr, prrr, prrrr, rrr]
  loose: [rumble, hum, whir, growl, motor]
  note: >-
    Purring is a soft, even rumble on both the in- and out-breath; a growl is harsher and only on the breath out.

cat-hiss:
  synonyms: [hiss, hisses, hissing, cat hiss, cat hissing, spit, spitting, angry cat, cat spitting]
  written: [hiss, hsss, pssst, ffft]
  loose: [growl, snarl, yowl, shush]
  note: >-
    Cats, snakes and air leaks all "hiss"; a cat's hiss is short and spitting, a snake's long and even, an air leak steady and mechanical.

cow:
  synonyms: [moo, moos, mooing, cow, cows, cattle, lowing, low, bellow, bellowing, cow mooing]
  written: [moo, mooo, moooo]
  loose: [bull, calf, ox, groan, foghorn]
  note: >-
    "Lowing" is the old-fashioned word for a cow's moo; a bellow is the louder call of a bull or distressed cow.

horse-neigh:
  synonyms: [neigh, neighs, neighing, whinny, whinnies, whinnying, nicker, nickering, horse neigh, horse whinny, bray]
  written: [neigh, nay, whinny]
  loose: [snort, horse snort, laugh]
  note: >-
    A whinny is the long, shaky call; a nicker is a soft low greeting; a bray is a donkey's "hee-haw".

horse-hooves:
  synonyms: [hooves, hoofbeats, hoof beats, clip-clop, clip clop, clopping, galloping, gallop, trotting, trot, cantering, horse walking, horse hooves]
  written: [clip-clop, clippety-clop, clop clop, clop]
  loose: [footsteps, knocking, tapping, stampede, horse]

rooster:
  synonyms: [rooster, rooster crowing, crow, crows, crowing, cockerel, cock, cock crow, cock-a-doodle-doo]
  written: [cock-a-doodle-doo, cockadoodledoo, kikeriki]
  loose: [chicken, hen, cluck, farm]
  note: >-
    "Crow" is also a bird; a rooster crows (a long dawn call) while a crow caws.

chicken:
  synonyms: [cluck, clucks, clucking, chicken, chickens, hen, hens, bawk, chicken clucking, hens clucking, cackle, cackling, squawk]
  written: [cluck, cluck cluck, bawk, buk buk, bok bok, buck-buck-bacaw]
  loose: [rooster, chick, peep, poultry]
  note: >-
    Hens cluck and cackle; the loud "cock-a-doodle-doo" belongs to a rooster.

pig:
  synonyms: [oink, oinks, oinking, pig, pigs, pig grunting, grunt, grunting, squeal, squealing, snuffling, hog, swine]
  written: [oink, oink oink, snort, wee wee]
  loose: [snort, piglet, snore]
  note: >-
    People say "snort" for pigs, but a pig's sound is mostly short nasal grunts plus high squeals.

sheep:
  synonyms: [baa, baas, baaing, bleat, bleats, bleating, sheep, sheep bleating, lamb, lambs, ewe]
  written: [baa, baaa, meh, maa]
  loose: [goat, flock]
  note: >-
    Sheep and goats both bleat; a sheep's "baa" is softer and more wavering, a goat's harsher and more like a person yelling.

goat:
  synonyms: [goat, goats, goat bleating, bleat, bleats, bleating, goat scream, screaming goat, kid, maa]
  written: [meh, maa, baa, meeh]
  loose: [sheep, baa, scream, yell]
  note: >-
    Sheep and goats both bleat; a goat is harsher and more human, which is why "screaming goat" videos sound like a person yelling.

duck:
  synonyms: [quack, quacks, quacking, duck, ducks, duck quacking, mallard, drake]
  written: [quack, quack quack]
  loose: [goose, honk, squawk, waterfowl]

goose:
  synonyms: [honk, honks, honking, goose, geese, goose honking, geese honking, gaggle, canada goose, hissing goose]
  written: [honk, honk honk]
  loose: [duck, quack, squawk, car horn, hiss]
  note: >-
    "Honk" also means a car horn; a goose's honk is brassy and nasal, usually from a flock overhead.

crow:
  synonyms: [caw, caws, cawing, crow, crows, crow cawing, raven, ravens, rook, rooks, jackdaw, croak of a raven]
  written: [caw, caw caw, kraa, kraah]
  loose: [squawk, croak, crowing, call]
  note: >-
    Crows and rooks caw; a raven's call is a deeper croak; and "crowing" is what a rooster does, not a crow.

songbird:
  synonyms: [birdsong, bird song, songbird, bird singing, singing bird, chirp, chirps, chirping, tweet, tweets, tweeting, warble, warbling, trill, twitter]
  written: [tweet, tweet tweet, chirp, cheep, tweedle]
  loose: [birds, whistle, chirrup, cheep, peep, dawn chorus]
  note: >-
    One bird singing is a songbird; many birds at once outdoors is the dawn chorus.

owl:
  synonyms: [hoot, hoots, hooting, owl, owls, owl hooting, owl call, tawny owl, screech owl, barn owl]
  written: [hoo hoo, twit-twoo, to-whit to-whoo, whoo]
  loose: [coo, call, screech, night bird]
  note: >-
    The classic "twit-twoo" is two tawny owls answering each other; a barn owl screeches rather than hoots.

pigeon:
  synonyms: [coo, coos, cooing, pigeon, pigeons, pigeon cooing, dove, doves, dove cooing, wood pigeon, turtle dove, mourning dove]
  written: [coo, coo-coo, roo-coo]
  loose: [hoot, owl, purr, warble]
  note: >-
    Doves and pigeons are the same family and both coo; a coo is throatier and more rolling than an owl's hollow hoot.

seagull:
  synonyms: [seagull, seagulls, gull, gulls, seagull call, gull call, seagull crying, squawk, squawking, seabird, kittiwake]
  written: [kyow, kee-ow, squawk]
  loose: [seaside, screech, cry, mew, laughing gull]

frog:
  synonyms: [croak, croaks, croaking, ribbit, frog, frogs, frog croaking, toad, toads, bullfrog, frog chorus, peepers]
  written: [ribbit, croak]
  loose: [burp, chirp, crickets, night sounds, quack]
  note: >-
    "Croak" is also a hoarse voice or a raven; frogs croak in a rhythmic, often chorused pattern near water at night.

crickets:
  synonyms: [crickets, cricket, cricket chirping, crickets chirping, chirping, cicada, cicadas, katydid, grasshopper, chirping insects, night insects, stridulation]
  written: [chirp chirp, cri-cri]
  loose: [insects, bugs, chirp, frogs, night ambience, buzz]
  note: >-
    Crickets pulse in short regular chirps; cicadas are a louder, continuous daytime buzz that rises and falls.

bees:
  synonyms: [bees, bee, buzz, buzzing, bees buzzing, beehive, hive, swarm, bumblebee, honeybee, wasp, wasps, drone]
  written: [bzzz, buzz, zzz]
  loose: [fly, insects, hum, hornet]
  note: >-
    One fly makes a loud buzz that comes and goes as it passes; bees are many overlapping buzzes at a steadier level.

