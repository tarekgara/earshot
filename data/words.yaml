    "Nee-naw" is the British two-tone; American sirens are more often written "wee-woo" and use a rising and falling wail or a fast yelp.

smoke-alarm:
  synonyms: [smoke alarm, smoke detector, fire alarm, smoke alarm beeping, smoke detector chirp, low battery chirp, carbon monoxide alarm, co alarm, alarm beeping, beeping alarm]
  written: [beep beep beep, beep, chirp, eep eep eep]
  loose: [alarm, beep, beeping, alarm clock, siren, chirp]
  note: >-
    "Fire alarm" can mean a building's ringing bell too; a smoke detector is a piercing beep in threes, or a lone chirp when its battery is low.

reversing-beeper:
  synonyms: [reversing beeper, reversing alarm, reversing beep, backup alarm, backup beeper, back-up beeper, truck reversing, truck backing up, vehicle reversing, beep beep beep]
  written: [beep beep beep, beep, meep meep]
  loose: [beeping, alarm, truck, forklift, beeper]
  note: >-
    "Reversing" is British and "backing up" American; the beep is evenly spaced and steady, not in threes like a smoke alarm.

buzzer:
  synonyms: [buzzer, buzzers, buzz, buzzing, wrong answer, game show buzzer, error buzzer, intercom, door buzzer, entry buzzer, buzz in, buzzer sound, quiz buzzer]
  written: [bzzt, bzzzt, errr]
  loose: [alarm, horn, beep, doorbell, klaxon]
  note: >-
    "Buzz" also means bees, phones and electrical hum; a buzzer is a harsh, flat electronic buzz, usually short and deliberate.

dial-tone:
  synonyms: [dial tone, dialing tone, dialling tone, busy signal, busy tone, engaged tone, ringback tone, touch tones, touch-tone, dtmf, keypad tones, phone tones, off-hook tone]
  written: [beep, boop, beep boop, doo doo doo]
  loose: [tone, hum, beep, phone, telephone]
  note: >-
    "Engaged" (UK) and "busy" (US) name the same pulsing tone; a steady unbroken tone is the dial tone, and short pitched blips are keypad touch tones.

church-bell:
  synonyms: [church bell, church bells, bells, bell tower, bells tolling, toll, tolling, peal, pealing, chimes, carillon, knell, bong]
  written: [ding dong, dong, bong, gong]
  loose: [bell, chime, ringing, gong, clock chime]
  note: >-
    A tolled bell is one slow repeated stroke, a peal many bells in sequence; a gong is a struck disc that swells rather than rings at once.

school-bell:
  synonyms: [school bell, electric bell, fire bell, bell ringing, ringing bell, alarm bell, class bell, recess bell, break bell, bell going off, trill, clanging bell]
  written: [brrring, rrrring, brrrrr, ring]
  loose: [bell, alarm, fire alarm, phone ring, alarm clock]
  note: >-
    "Fire alarm" may mean this ringing bell or a beeping smoke detector; an electric bell is a clapper hammering the bell many times a second.

foghorn:
  synonyms: [foghorn, fog horn, foghorns, ship horn, ship's horn, boat horn, ship horn blast, lighthouse horn, diaphone, ship's whistle]
  written: [booo, bwaaa, hooonk, braaam]
  loose: [horn, train horn, moo, groan, hooter]
  note: >-
    A foghorn is very deep and long; a cow's moo is shorter, nasal and wavers.

gong:
  synonyms: [gong, gongs, gong strike, gong hit, gong crash, tam-tam, temple gong, dinner gong, gonging]
  written: [gong, bong, bwong, bwaang]
  loose: [bell, cymbal, crash, chime, church bell]
  note: >-
    A gong swells into a roar after it is struck; a bell starts loudest and fades.

# ================================================================ machines

drill:
  synonyms: [drill, drills, drilling, power drill, electric drill, cordless drill, drill bit, screwdriver, electric screwdriver, drill driver, impact driver, hammer drill]
  written: [vrrrr, wheeee, rrrrr, brrrr]
  loose: [whine, whir, buzz, dentist drill, power tool, blender]
  note: >-
    A power drill whines up to speed and strains as it bites; a jackhammer, sometimes called a "road drill", is a rapid hammering instead.

dentist-drill:
  synonyms: [dentist drill, dentist's drill, dental drill, dentist, dentists, drilling teeth, dental handpiece, high-speed drill, air turbine drill]
  written: [eeeee, wheeee, neeee]
  loose: [drill, whine, shriek, mosquito, buzz]
  note: >-
    A dentist's drill is a much higher, thinner whine than a power drill and barely changes pitch.

hammering:
  synonyms: [hammering, hammer, hammers, hammered, nailing, hammering nails, banging, pounding, hammer blows, mallet, hammer and nail, clang]
  written: [bang bang, tap tap, thunk, clang, bam]
  loose: [knocking, tapping, construction, jackhammer]
  note: >-
    A hammer is a sharp, ringing blow in a steady rhythm; a knock on a door is softer knuckle on wood.

handsaw:
  synonyms: [sawing, saw, saws, sawed, handsaw, hand saw, sawing wood, cutting wood, wood saw, hacksaw, rasp, rasping, carpentry]
  written: [rasp, scrape]
  loose: [scraping, chainsaw, grinding, woodwork, snoring]
  note: >-
    "Saw" is also used for power saws; a handsaw is a rasping back-and-forth with a gap at each turn, not a continuous motor.

chainsaw:
  synonyms: [chainsaw, chain saw, chainsaws, chainsawing, chainsaw revving, chainsaw cutting, logging, cutting trees, tree felling, power saw]
  written: [vrrrrm, brrrrr, rrrrrr]
  loose: [saw, motorcycle, lawn mower, revving, engine, motor]
  note: >-
    A chainsaw revs and drops as it cuts; a motorbike revs too but moves through gears and passes by.

jackhammer:
  synonyms: [jackhammer, jackhammers, pneumatic drill, road drill, breaker, pneumatic hammer, concrete breaker, roadworks, road works, construction drilling]
  written: [rat-a-tat-tat, brrrap, dadadada, tatatatat]
  loose: [drill, hammering, construction, drilling, machine gun]
  note: >-
    "Pneumatic drill" and "road drill" are British for jackhammer, though it hammers rather than drills.

lawn-mower:
  synonyms: [lawn mower, lawnmower, lawnmowers, mower, mowing, mowing the lawn, mowing grass, ride-on mower, strimmer, string trimmer, weed whacker, weed eater, leaf blower, garden machine]
  written: [vrrrrr, brrrrr, drrrrr]
  loose: [engine, motor, chainsaw, motorcycle, drone, gardening]
  note: >-
    "Strimmer" (UK) and "weed whacker" (US) are higher and buzzier than a mower's steady drone.

fan:
  synonyms: [fan, electric fan, ceiling fan, desk fan, air conditioner, air conditioning, aircon, ac, ventilation, extractor fan, hvac, room tone, whirring]
  written: [whirr, fwoosh, whooosh]
  loose: [hum, whoosh, wind, air, motor, drone, hiss, white noise]
  note: >-
    A fan is a soft, steady whoosh of air with a faint motor hum; a pure low buzz with no air in it is electrical hum.

printer:
  synonyms: [printer, printers, printing, prints, inkjet, inkjet printer, laser printer, printer feeding paper, photocopier, copier, copy machine, fax machine, dot matrix]
  written: [whirr, whirr-click]
  loose: [whir, machine, scanner, office noise, typing, clicking]
  note: >-
    A printer whirrs, clicks and swishes paper through in bursts; a photocopier is similar but louder, with a scanning light sweep.

electrical-hum:
  synonyms: [electrical hum, hum, humming, mains hum, buzz, buzzing, electrical buzz, transformer, transformer hum, power lines, fluorescent light buzz, ground hum, 50 hz, 60 hz]
  written: [mmmmm, hmmmm, bzzzz, zzzz]
  loose: [drone, fan, static, interference, feedback, whine]
  note: >-
    "Hum" also means a person humming a tune and "buzz" means insects; electrical hum is a low, constant note at 50 or 60 Hz that never changes.

# ================================================================ impacts

gunshot:
  synonyms: [gunshot, gunshots, gunfire, shot, shots, shots fired, shooting, gun, gun firing, firing, rifle, pistol, handgun, shotgun, bang]
  written: [bang, pow, blam, bang bang, kapow, pew]
  loose: [crack, pop, explosion, firecracker, backfire]
  note: >-
    A gunshot is an extremely sharp crack, often echoed; a firecracker is lighter and comes in strings, a car backfire is muffled.

gun-cock:
  synonyms: [gun cocking, gun cock, cocking, cocking a gun, cocked, rack, racking, racking the slide, slide racking, pump shotgun, bolt action, reload, reloading, chambering a round]
  written: [click-clack, chk-chk, ka-chunk, click]
  loose: [click, clack, metallic click, gun, camera shutter]
  note: >-
    A gun cocking is a heavy metallic double click; a camera shutter is lighter and quicker.

car-backfire:
  synonyms: [car backfire, backfire, backfires, backfiring, exhaust backfire, engine backfire, exhaust pop, exhaust bang, misfire]
  written: [bang, pop, blam, pow, ka-pow]
  loose: [bang, gunshot, pop, explosion]
  note: >-
    A backfire is a loud, muffled bang from an exhaust; a gunshot is sharper and cracks.

explosion:
  synonyms: [explosion, explosions, explode, explodes, exploding, blast, blasts, boom, detonation, bomb, bomb going off, kaboom, blow up, blowing up]
  written: [boom, kaboom, ka-boom, ba-boom, bwoom]
  loose: [bang, thunder, crash, gunshot, fireworks, rumble]
  note: >-
    An explosion is a deep boom followed by a roar and falling debris; thunder rolls on without debris.

fireworks:
  synonyms: [fireworks, firework, firework display, fireworks display, firecracker, firecrackers, bangers, rocket, rockets, sparklers, crackers, bang snaps, roman candle]
  written: [bang, pop, whizz, fwoosh, crackle, whee]
  loose: [explosion, bang, gunshot, crackling, celebration]
  note: >-
    Fireworks whistle up and burst with crackle and fizz; strings of fast pops are firecrackers, and a single sharp crack is more likely a gunshot.

glass-clink:
  synonyms: [glasses clinking, clinking glasses, glass clink, clink, clinks, clinking, cheers, toast, toasting, chink, tinkle, ting]
  written: [clink, ting, tink, chink]
  loose: [ding, ping, dishes, bell, chime]
  note: >-
    Two glasses touching is a single bright ringing "ting"; many glasses and plates handled at once is dishes.

coins:
  synonyms: [coins, coin, change, loose change, coins dropping, coins jingling, coin drop, spinning coin, money, cash, counting coins, jingle, jingling, piggy bank]
  written: [clink, jingle, cha-ching, ka-ching, tink]
  loose: [keys, clink, rattle, cash register, slot machine]
  note: >-
    "Ka-ching" is really a cash register; loose coins jingle and clink, and a dropped one rings and spins down.

splash:
  synonyms: [splash, splashes, splashing, splashed, plop, plops, plopping, sploosh, dive, diving, jump in water, jumping in, cannonball, belly flop, dropped in water]
  written: [splash, sploosh, plop, kersplash, splosh]
  loose: [water, waves, drip, swim, bubbling, slosh]
  note: >-
    A plop is a small object falling in; a splash is bigger, and a sploosh or cannonball a person jumping in.

thud:
  synonyms: [thud, thudding, thump, thumps, thumping, bump, fall, falls, falling, something dropping, dull thud, heavy thud, clunk, wallop]
  written: [thud, thump, thunk, bump, whump]
  loose: [bang, crash, knock, slam, boom, drop]
  note: >-
    A thud is a dull, low thump from something soft and heavy; if things clatter and break, it is a crash.

crash:
  synonyms: [crash, crashes, crashing, smash, smashing, collision, things falling, clatter, clattering, falling over, knocked over, crashing down, car crash, pileup]
  written: [crash, smash, kerrash, clatter, bang, kablam]
  loose: [bang, thud, glass breaking, explosion, slam, wreck]
  note: >-
    "Crash" covers many impacts; this entry is a messy clatter of objects, while one dull hit is a thud and breaking glass has its own entry.

squeak:
  synonyms: [squeak, squeaks, squeaking, squeaky, squeal, squealing, squeaky shoes, shoe squeak, rubber squeak, chair squeak, squeaky chair, squeaky floorboard, squeaky toy, squeegee]
  written: [squeak, eek, skree, squee]
  loose: [creak, chirp, mouse, screech]
  note: >-
    A squeak is short and high from rubber or wood rubbing; a creak is lower and slower, like a door hinge.
