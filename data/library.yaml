# Earshot library definition.
#
# Taxonomy, perceptual traits (used by "Not sure?"), listening cues, the
# confusion map, and which recordings become reference clips.
# `python tools/build.py` turns this into js/data.js and audio/.
#
# Trait vocabulary (keep in sync with `questions`):
#   source:   voice body animal nature machine signal object
#   shape:    once repeats steady irregular
#   pitched:  yes | no
#   tone:     airy rough voiced ringing knock rumble shrill crackle watery drone rattle creak
#   register: low | mid | high

sources:
  commons:
    name: Wikimedia Commons
    url: https://commons.wikimedia.org/
    license: per file (CC0, public domain, CC BY or CC BY-SA)
    credit: Individual authors, credited per clip
  url:
    name: Direct downloads
    url: ""
    license: per file
    credit: Credited per clip
  generated:
    name: Earshot signal generator
    url: tools/signals.py
    license: CC0-1.0
    credit: Generated in code for this library

families:
  - id: voice
    name: Voice and mouth
    blurb: Sounds people make with their voice, breath and mouth, other than words.
  - id: body
    name: Body and actions
    blurb: People moving, touching and doing things.
  - id: animals
    name: Animals
    blurb: Calls, cries and movement of animals, wild and domestic.
  - id: nature
    name: Nature and weather
    blurb: Rain, wind, water and fire.
  - id: home
    name: Home and objects
    blurb: Doors, kitchens, bathrooms and the small things we handle every day.
  - id: vehicles
    name: Vehicles
    blurb: Engines, horns, brakes and things that pass by.
  - id: signals
    name: Alarms and signals
    blurb: Sounds designed to get attention.
  - id: machines
    name: Tools and machines
    blurb: Motors, power tools and electrical hums.
  - id: impacts
    name: Impacts and bangs
    blurb: Hits, crashes, shots and explosions.

questions:
  - id: source
    short: Made by
    ask: What do you think made it?
    hint: Your first instinct is usually right. Skip it if you have no idea.
    weight: 3
    options:
      - { value: voice, label: "A person's voice or mouth" }
      - { value: body, label: "A person moving or doing something" }
      - { value: animal, label: "An animal" }
      - { value: nature, label: "Nature or weather" }
      - { value: machine, label: "A machine, engine or vehicle" }
      - { value: signal, label: "A beep, bell or alarm" }
      - { value: object, label: "Objects hitting, breaking or moving" }
  - id: shape
    short: Over time
    ask: How does it play out over time?
    hint: Listen for a few seconds. Is it one event, a pattern, or a continuous sound?
    weight: 2.5
    options:
      - { value: once, label: "One short event" }
      - { value: repeats, label: "Repeats in a regular pattern" }
      - { value: steady, label: "Keeps going steadily" }
      - { value: irregular, label: "Comes and goes unevenly" }
  - id: tone
    short: Texture
    ask: Which texture is closest?
    hint: Ignore what it might be and just listen to the grain of the sound.
    weight: 3
    options:
      - { value: airy, label: "Airy, breathy, whooshing" }
      - { value: rough, label: "Rough, raspy, harsh" }
      - { value: voiced, label: "Voice-like, vocal" }
      - { value: ringing, label: "Ringing, bell-like" }
      - { value: knock, label: "A knock, tap or thud" }
      - { value: rumble, label: "A deep rumble or roar" }
      - { value: shrill, label: "Shrill, piercing" }
      - { value: crackle, label: "Crackling, sizzling" }
      - { value: watery, label: "Watery, splashing" }
      - { value: drone, label: "A hum, whir or buzz" }
      - { value: rattle, label: "A rattle, clatter or jingle" }
      - { value: creak, label: "A creak, squeak or scrape" }
  - id: pitched
    short: Pitch
    ask: Could you hum along with it?
    hint: Some sounds have a clear note (a beep, a meow, a whistle). Others are pure noise (rain, a cough).
    weight: 1.5
    options:
      - { value: "yes", label: "Yes, there's a clear tone" }
      - { value: "no", label: "No, it's more like noise" }
  - id: register
    short: Register
    ask: Where does it sit?
    hint: Is it deep and heavy, in the middle, or high and thin?
    weight: 1.5
    options:
      - { value: low, label: "Low and deep" }
      - { value: mid, label: "In the middle" }
      - { value: high, label: "High and thin" }

# Sounds. `samples` are filled in from sources/; entries without samples are
# listed (and appear in the confusion map) until a recording is found.

sounds:

  # ---------------------------------------------------------------- voice
  - id: cough
    name: Cough
    family: voice
    sub: Respiratory
    traits: { source: voice, shape: [once, irregular], tone: [rough], pitched: "no", register: [mid] }
    summary: A sudden burst of air forced out of the lungs. Explosive start, rough, often in clusters.
    listen: ["A hard, explosive start", "A rough, noisy burst with little pitch"]
    confusions:
      - { id: throat-clear, cue: "Throat-clearing is smaller and voiced, a deliberate 'ahem'." }
      - { id: sneeze, cue: "A sneeze has a breath-in build-up, then one sharp 'choo'." }
      - { id: laugh, cue: "Laughter is pitched and rhythmic: 'ha-ha-ha'." }
      - { id: bark, cue: "A dog bark is pitched and voiced; a cough is noise." }
    samples:
      - {"src": "commons", "file": "File:Woman coughing three times.wav", "label": "Recording"}
      - {"src": "zip", "url": "https://www.dropbox.com/s/ybgaprezl8ubcce/vs_release_44k.zip?dl=1", "inner": "data_44k/f*_cough.wav", "pick": 0, "page": "https://github.com/YuanGongND/vocalsound", "license": "CC BY-SA 4.0", "author": "VocalSound dataset (Gong, Yu and Glass, MIT)", "label": "Woman"}
      - {"src": "zip", "url": "https://www.dropbox.com/s/ybgaprezl8ubcce/vs_release_44k.zip?dl=1", "inner": "data_44k/m*_cough.wav", "pick": 1, "page": "https://github.com/YuanGongND/vocalsound", "license": "CC BY-SA 4.0", "author": "VocalSound dataset (Gong, Yu and Glass, MIT)", "label": "Man"}

  - id: throat-clear
    name: Throat clearing
    family: voice
    sub: Respiratory
    aliases: [ahem, harrumph]
    traits: { source: voice, shape: [once], tone: [rough, voiced], pitched: "no", register: [low, mid] }
    summary: A short, deliberate rasp to clear the throat. Often a polite "ahem".
    listen: ["A small, controlled rasp", "Often two parts: 'a-hem'"]
    confusions:
      - { id: cough, cue: "A cough is bigger and more explosive." }
      - { id: grunt, cue: "A grunt comes from effort, not the throat." }
      - { id: scoff, cue: "A scoff is a puff of air through the nose or lips." }
    samples:
      - {"src": "zip", "url": "https://www.dropbox.com/s/ybgaprezl8ubcce/vs_release_44k.zip?dl=1", "inner": "data_44k/f*_throatclearing.wav", "pick": 0, "page": "https://github.com/YuanGongND/vocalsound", "license": "CC BY-SA 4.0", "author": "VocalSound dataset (Gong, Yu and Glass, MIT)", "label": "Woman"}
      - {"src": "zip", "url": "https://www.dropbox.com/s/ybgaprezl8ubcce/vs_release_44k.zip?dl=1", "inner": "data_44k/m*_throatclearing.wav", "pick": 1, "page": "https://github.com/YuanGongND/vocalsound", "license": "CC BY-SA 4.0", "author": "VocalSound dataset (Gong, Yu and Glass, MIT)", "label": "Man"}

  - id: sneeze
    name: Sneeze
    family: voice
    sub: Respiratory
    aliases: [achoo]
    traits: { source: voice, shape: [once], tone: [airy, rough], pitched: "no", register: [mid, high] }
    summary: An involuntary explosion of air through nose and mouth, usually after a sharp intake of breath.
    listen: ["A quick breath in ('ah... ah...')", "One sharp, sprayed 'choo'"]
    confusions:
      - { id: cough, cue: "A cough has no build-up and repeats more." }
      - { id: sniff, cue: "A sniff goes in, not out." }
    samples:
      - {"src": "commons", "file": "File:Double sneeze (man).ogg", "label": "Recording"}
      - {"src": "zip", "url": "https://www.dropbox.com/s/ybgaprezl8ubcce/vs_release_44k.zip?dl=1", "inner": "data_44k/f*_sneeze.wav", "pick": 25, "page": "https://github.com/YuanGongND/vocalsound", "license": "CC BY-SA 4.0", "author": "VocalSound dataset (Gong, Yu and Glass, MIT)", "label": "Woman"}
      - {"src": "zip", "url": "https://www.dropbox.com/s/ybgaprezl8ubcce/vs_release_44k.zip?dl=1", "inner": "data_44k/m*_sneeze.wav", "pick": 1, "page": "https://github.com/YuanGongND/vocalsound", "license": "CC BY-SA 4.0", "author": "VocalSound dataset (Gong, Yu and Glass, MIT)", "label": "Man"}

  - id: sniff
    name: Sniff
    family: voice
    sub: Respiratory
    aliases: [sniffle]
    traits: { source: voice, shape: [once, repeats], tone: [airy], pitched: "no", register: [mid, high] }
    summary: A quick breath in through the nose. Short, airy, sometimes wet with a cold.
    listen: ["Air rushing inward through the nose", "Short and hissy"]
    confusions:
      - { id: sneeze, cue: "A sneeze bursts outward." }
      - { id: sigh, cue: "A sigh is a long breath out through the mouth." }
      - { id: scoff, cue: "A scoff is a short puff out, often with attitude." }
    samples:
      - {"src": "zip", "url": "https://opengameart.org/sites/default/files/Owlish%20Media%20Sound%20Effects.zip", "inner": "Human/sniff.wav", "page": "https://opengameart.org/content/sound-effects-pack", "license": "CC0", "author": "OwlishMedia", "label": "Recording"}
      - {"src": "zip", "url": "https://www.dropbox.com/s/ybgaprezl8ubcce/vs_release_44k.zip?dl=1", "inner": "data_44k/f*_sniff.wav", "pick": 25, "page": "https://github.com/YuanGongND/vocalsound", "license": "CC BY-SA 4.0", "author": "VocalSound dataset (Gong, Yu and Glass, MIT)", "label": "Woman"}
      - {"src": "zip", "url": "https://www.dropbox.com/s/ybgaprezl8ubcce/vs_release_44k.zip?dl=1", "inner": "data_44k/m*_sniff.wav", "pick": 1, "page": "https://github.com/YuanGongND/vocalsound", "license": "CC BY-SA 4.0", "author": "VocalSound dataset (Gong, Yu and Glass, MIT)", "label": "Man"}

  - id: laugh
    name: Laugh
    family: voice
    sub: Emotional
    aliases: [laughter, belly laugh]
    traits: { source: voice, shape: [repeats, irregular], tone: [voiced], pitched: "yes", register: [mid] }
    summary: Rhythmic, voiced bursts of breath. "Ha-ha-ha", from a chuckle to a roar.
    listen: ["Repeated voiced pulses", "Pitch that rises and falls with each burst"]
    confusions:
      - { id: crying, cue: "Sobbing has a similar rhythm but sounds strained and falls in pitch." }
      - { id: giggle, cue: "A giggle is higher, lighter and smaller." }
      - { id: chuckle, cue: "A chuckle is low and mostly kept in the chest." }
      - { id: cough, cue: "A cough is noisy and unpitched." }
    samples:
      - {"src": "commons", "file": "File:Bursting out laughing.ogg", "label": "Recording"}
      - {"src": "zip", "url": "https://www.dropbox.com/s/ybgaprezl8ubcce/vs_release_44k.zip?dl=1", "inner": "data_44k/f*_laughter.wav", "pick": 2, "page": "https://github.com/YuanGongND/vocalsound", "license": "CC BY-SA 4.0", "author": "VocalSound dataset (Gong, Yu and Glass, MIT)", "label": "Woman"}
      - {"src": "zip", "url": "https://www.dropbox.com/s/ybgaprezl8ubcce/vs_release_44k.zip?dl=1", "inner": "data_44k/m*_laughter.wav", "pick": 1, "page": "https://github.com/YuanGongND/vocalsound", "license": "CC BY-SA 4.0", "author": "VocalSound dataset (Gong, Yu and Glass, MIT)", "label": "Man"}

  - id: giggle
    name: Giggle
    family: voice
    sub: Emotional
    aliases: [titter, snicker]
    traits: { source: voice, shape: [repeats], tone: [voiced, airy], pitched: "yes", register: [high] }
    summary: A light, high, nervous or playful laugh, often half-suppressed.
    listen: ["High, quick, breathy pulses", "Lighter and smaller than a laugh"]
    confusions:
      - { id: laugh, cue: "A full laugh is louder and lower." }
      - { id: baby-laugh, cue: "A baby's laugh is even higher, with squeals." }
    samples:
      - {"src": "commons", "file": "File:Giggle.ogg", "label": "Recording 1"}
      - {"src": "commons", "file": "File:Boy giggle.ogg", "label": "Recording 2", "start": 3.0, "dur": 3.0}
      - {"src": "commons", "file": "File:Four Years Old child laughing.ogg", "label": "Recording 3"}

  - id: chuckle
    name: Chuckle
    family: voice
    sub: Emotional
    traits: { source: voice, shape: [repeats, once], tone: [voiced], pitched: "yes", register: [low, mid] }
    summary: A quiet, low laugh, mostly in the chest with the mouth closed or barely open.
    listen: ["Low, soft 'heh-heh'", "Short and contained"]
    confusions:
      - { id: laugh, cue: "A laugh opens up and gets louder." }
      - { id: scoff, cue: "A scoff is one dismissive puff, not a series." }
      - { id: grunt, cue: "A grunt is a single strained sound." }
    samples:
      - {"src": "commons", "file": "File:Different-Types-of-Laughter-Modulate-Connectivity-within-Distinct-Parts-of-the-Laughter-Perception-pone.0063441.s011.oga", "label": "Recording 1"}
      - {"src": "commons", "file": "File:Short male snorts and giggles.ogg", "label": "Recording 2", "start": 2.0, "dur": 2.0}
      - {"src": "commons", "file": "File:Short clip of girl laughing.wav", "label": "Recording 3"}

  - id: scoff
    name: Scoff
    family: voice
    status: wanted
    sub: Emotional
    aliases: [pff, pfft, snort laugh, derisive laugh]
    traits: { source: voice, shape: [once], tone: [airy], pitched: "no", register: [mid] }
    summary: A short, dismissive puff of air through the nose or lips, "pff". Disbelief or contempt.
    listen: ["One quick puff, often through the nose", "Little or no voice in it"]
    confusions:
      - { id: snort, cue: "A snort is louder and rattles in the nose." }
      - { id: sigh, cue: "A sigh is long and slow; a scoff is instant." }
      - { id: chuckle, cue: "A chuckle is voiced and repeats." }
      - { id: sniff, cue: "A sniff goes inward." }
  - id: snort
    name: Snort
    family: voice
    sub: Emotional
    traits: { source: voice, shape: [once], tone: [rough], pitched: "no", register: [low, mid] }
    summary: A forceful burst of air through the nose that rattles the soft palate. Laughing, mocking or surprise.
    listen: ["A rattling, piggy rasp in the nose"]
    confusions:
      - { id: scoff, cue: "A scoff is a soft puff without the rattle." }
      - { id: pig, cue: "A pig grunts in repeated, lower rasps." }
      - { id: snore, cue: "A snore repeats with breathing, slowly." }
    samples:
      - {"src": "commons", "file": "File:Short male snorts and giggles.ogg", "label": "Recording 1"}

  - id: sigh
    name: Sigh
    family: voice
    sub: Breath
    traits: { source: voice, shape: [once], tone: [airy, voiced], pitched: "no", register: [mid] }
    summary: A long, audible breath out, often with a falling voice. Tiredness, relief or frustration.
    listen: ["A slow exhale lasting a second or more", "Sometimes a falling 'haaa'"]
    confusions:
      - { id: gasp, cue: "A gasp is a sharp breath in." }
      - { id: yawn, cue: "A yawn is longer, opens the mouth wide, and rises then falls." }
      - { id: scoff, cue: "A scoff is a quick puff." }
      - { id: groan, cue: "A groan is voiced and strained." }
    samples:
      - {"src": "commons", "file": "File:Three sighs.ogg", "label": "Recording"}
      - {"src": "zip", "url": "https://www.dropbox.com/s/ybgaprezl8ubcce/vs_release_44k.zip?dl=1", "inner": "data_44k/f*_sigh.wav", "pick": 2, "page": "https://github.com/YuanGongND/vocalsound", "license": "CC BY-SA 4.0", "author": "VocalSound dataset (Gong, Yu and Glass, MIT)", "label": "Woman"}
      - {"src": "zip", "url": "https://www.dropbox.com/s/ybgaprezl8ubcce/vs_release_44k.zip?dl=1", "inner": "data_44k/m*_sigh.wav", "pick": 1, "page": "https://github.com/YuanGongND/vocalsound", "license": "CC BY-SA 4.0", "author": "VocalSound dataset (Gong, Yu and Glass, MIT)", "label": "Man"}

  - id: gasp
    name: Gasp
    family: voice
    sub: Breath
    traits: { source: voice, shape: [once], tone: [airy], pitched: "no", register: [mid, high] }
    summary: A sudden, sharp breath in. Surprise, shock or effort.
    listen: ["A quick, noisy intake through the mouth"]
    confusions:
      - { id: sigh, cue: "A sigh breathes out, slowly." }
      - { id: sniff, cue: "A sniff goes through the nose and is smaller." }
      - { id: panting, cue: "Panting repeats in and out." }
    samples:
      - {"src": "zip", "url": "https://opengameart.org/sites/default/files/Owlish%20Media%20Sound%20Effects.zip", "inner": "Human/gasp1.wav", "page": "https://opengameart.org/content/sound-effects-pack", "license": "CC0", "author": "OwlishMedia", "label": "Recording 1"}
      - {"src": "zip", "url": "https://opengameart.org/sites/default/files/Owlish%20Media%20Sound%20Effects.zip", "inner": "Human/freakedbreath.wav", "page": "https://opengameart.org/content/sound-effects-pack", "license": "CC0", "author": "OwlishMedia", "label": "Recording 2"}

  - id: groan
    name: Groan
    family: voice
    sub: Emotional
    traits: { source: voice, shape: [once], tone: [voiced, rough], pitched: "yes", register: [low] }
    summary: A low, drawn-out voiced sound of displeasure, annoyance or pain. "Ughhh".
    listen: ["Low, sustained and voiced", "Strained or creaky in the throat"]
    confusions:
      - { id: moan, cue: "A moan is softer, smoother and more about pain or pleasure." }
      - { id: grunt, cue: "A grunt is short and clipped." }
      - { id: sigh, cue: "A sigh is mostly breath, not voice." }
    samples:
      - {"src": "url", "url": "https://opengameart.org/sites/default/files/female_hurt_grunts_groans_1.ogg", "page": "https://opengameart.org/content/female-hurt-grunts-groans", "license": "CC0", "author": "Nocturnal_Vanguard", "label": "Recording 3"}

  - id: moan
    name: Moan
    family: voice
    status: wanted
    sub: Emotional
    traits: { source: voice, shape: [once, irregular], tone: [voiced], pitched: "yes", register: [low, mid] }
    summary: A long, low, wavering voiced sound, usually of pain or discomfort.
    listen: ["A smooth, sustained, wavering hum-like voice"]
    confusions:
      - { id: groan, cue: "A groan is rougher and more annoyed." }
      - { id: hum, cue: "Humming follows a tune." }
  - id: grunt
    name: Grunt
    family: voice
    sub: Effort
    traits: { source: voice, shape: [once], tone: [voiced, rough], pitched: "no", register: [low] }
    summary: A short, low, guttural sound pushed out with effort, like lifting something heavy.
    listen: ["Short, low and clipped", "A tight push from the belly"]
    confusions:
      - { id: groan, cue: "A groan is longer and drawn out." }
      - { id: throat-clear, cue: "Throat clearing rasps higher in the throat." }
      - { id: pig, cue: "A pig's grunt is nasal and repeats." }
    samples:
      - {"src": "commons", "file": "File:Male grunts jumps.ogg", "label": "Recording 1"}
      - {"src": "commons", "file": "File:Male pain grunts.ogg", "label": "Recording 2"}
      - {"src": "url", "url": "https://opengameart.org/sites/default/files/01._effort_grunt_male.wav", "page": "https://opengameart.org/content/effort-sounds-male-audio-pack", "license": "CC-BY-SA 4.0", "author": "VoiceBosch", "label": "Recording 3"}

  - id: yawn
    name: Yawn
    family: voice
    sub: Breath
    traits: { source: voice, shape: [once], tone: [airy, voiced], pitched: "no", register: [mid] }
    summary: A long, wide-mouthed breath in and out, often with a voiced stretch at the end.
    listen: ["A long inhale, then a voiced 'aaah' that falls"]
    confusions:
      - { id: sigh, cue: "A sigh is only the breath out, shorter." }
      - { id: groan, cue: "A groan has no long inhale first." }
    samples:
      - {"src": "commons", "file": "File:Yawning 1.ogg", "label": "Recording 1"}
      - {"src": "commons", "file": "File:Yawning twice.ogg", "label": "Recording 2"}
      - {"src": "commons", "file": "File:Yawning 2.ogg", "label": "Recording 3"}

  - id: hum
    name: Humming
    family: voice
    sub: Vocal
    traits: { source: voice, shape: [steady], tone: [voiced, drone], pitched: "yes", register: [mid] }
    summary: Singing a tune with the mouth closed. "Mmm-mm-mmm".
    listen: ["A muffled, nasal voice following a melody"]
    confusions:
      - { id: moan, cue: "A moan doesn't follow a tune." }
      - { id: whistling, cue: "Whistling is pure and airy, higher." }
    samples:
      - {"src": "commons", "file": "File:Woman humming a nondescript tune.wav", "label": "Recording 1"}
      - {"src": "commons", "file": "File:Deep humming noise.wav", "label": "Recording 2"}

  - id: whistling
    name: Whistling
    family: voice
    sub: Vocal
    aliases: [human whistle, wolf whistle]
    traits: { source: voice, shape: [steady, once], tone: [shrill, airy], pitched: "yes", register: [high] }
    summary: A pure, high tone blown through pursed lips, as a tune or a call.
    listen: ["A pure, high, slightly breathy tone", "Slides between notes"]
    confusions:
      - { id: songbird, cue: "Birds are faster and more complex." }
      - { id: kettle, cue: "A kettle whistle is steady and rising, not a tune." }
      - { id: hum, cue: "Humming is voiced and lower." }
    samples:
      - {"src": "commons", "file": "File:Wolf whistle.ogg", "label": "Recording 1"}
      - {"src": "zip", "url": "https://opengameart.org/sites/default/files/Owlish%20Media%20Sound%20Effects.zip", "inner": "Human/attention-whistle.wav", "page": "https://opengameart.org/content/sound-effects-pack", "license": "CC0", "author": "OwlishMedia", "label": "Recording 2"}
      - {"src": "zip", "url": "https://opengameart.org/sites/default/files/Owlish%20Media%20Sound%20Effects.zip", "inner": "Human/wolf-whistle.wav", "page": "https://opengameart.org/content/sound-effects-pack", "license": "CC0", "author": "OwlishMedia", "label": "Recording 3"}

  - id: scream
    name: Scream
    family: voice
    sub: Emotional
    aliases: [shriek]
    traits: { source: voice, shape: [once], tone: [shrill, voiced], pitched: "yes", register: [high] }
    summary: A loud, high, piercing cry of fear, pain or excitement.
    listen: ["Very loud and high, often rough at the edges"]
    confusions:
      - { id: shout, cue: "A shout is lower and usually has words." }
      - { id: baby-cry, cue: "A baby's cry repeats in breathy waves." }
      - { id: siren, cue: "A siren is a pure tone that sweeps up and down." }
    samples:
      - {"src": "commons", "file": "File:NOW screaming.ogg", "label": "Recording 1"}
      - {"src": "commons", "file": "File:UncleSigmund - ahhh (cc0) (freesound).mp3", "label": "Recording 2"}
      - {"src": "commons", "file": "File:Scream-c.wav", "label": "Recording 3"}

  - id: shout
    name: Shout
    family: voice
    sub: Vocal
    aliases: [yell]
    traits: { source: voice, shape: [once], tone: [voiced, rough], pitched: "yes", register: [mid] }
    summary: A loud, forceful call, usually a word or name.
